server {
    listen 80;
    server_name localhost;

    # Static assets root
    root /usr/share/nginx/html;
    index index.html;

    # Landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simulator dashboard page
    location = /simulator {
        try_files /frontend/index.html =404;
    }

    # Frontend folder static files
    location /frontend/ {
        alias /usr/share/nginx/html/frontend/;
        try_files $uri $uri/ /frontend/index.html =404;
    }

    # Proxy REST API requests to Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections to Backend
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy paper PDF request to Backend
    location /paper.pdf {
        proxy_pass http://backend:8000/paper.pdf;
        proxy_set_header Host $host;
    }
}
