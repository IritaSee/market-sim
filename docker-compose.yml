version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: simpasar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SIMPASAR_LLM=${SIMPASAR_LLM:-}
    networks:
      - simpasar-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: simpasar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - simpasar-net

networks:
  simpasar-net:
    driver: bridge
