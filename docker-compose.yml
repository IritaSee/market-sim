version: '3.8'

services:
  backend:
    image: rizkyr/market-sim-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: simpasar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SIMPASAR_LLM=${SIMPASAR_LLM:-}
      - SIMPASAR_LLM_MODEL=${SIMPASAR_LLM_MODEL:-gemini-3.1-flash-lite}
      - SIMPASAR_LLM_RPM=${SIMPASAR_LLM_RPM:-12}
      - SIMPASAR_LLM_CONCURRENCY=${SIMPASAR_LLM_CONCURRENCY:-4}
      - SIMPASAR_LLM_BATCH_SIZE=${SIMPASAR_LLM_BATCH_SIZE:-11}
      - SIMPASAR_LLM_MAX_REQUESTS=${SIMPASAR_LLM_MAX_REQUESTS:-1000}
      - SIMPASAR_LLM_TIMEOUT_MS=${SIMPASAR_LLM_TIMEOUT_MS:-25000}
      - SIMPASAR_LLM_SENTIMENT_WEIGHT=${SIMPASAR_LLM_SENTIMENT_WEIGHT:-0.25}
      - SIMPASAR_LLM_SENTIMENT_HALFLIFE_S=${SIMPASAR_LLM_SENTIMENT_HALFLIFE_S:-60}
    networks:
      - simpasar-net

  frontend:
    image: rizkyr/market-sim-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: simpasar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - simpasar-net

networks:
  simpasar-net:
    driver: bridge
